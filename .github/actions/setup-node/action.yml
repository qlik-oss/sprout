name: "Setup nodejs"
description: "Setup nodejs"
author: "Qlik"

inputs:
  npm-token:
    description: "NPM CI token for registry authentication"
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Cache asdf
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.asdf/
          $(pnpm store path)
        key: ${{ runner.os }}-${{ hashFiles('**/.tool-versions') }}-v0.18.0
        restore-keys: |
          ${{ runner.os }}-asdf-v0.18.0

    - name: Cache for Turbo
      uses: rharkor/caching-for-turbo@2238fae6eb9a9936f92356f54cb3660200d105e7 # v2.5.1

    - name: Install asdf & tools
      uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1

    - name: Set NPM Token
      shell: bash
      run: echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" > ~/.npmrc
      if: ${{ inputs.npm-token != '' }}
